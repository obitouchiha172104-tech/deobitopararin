<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestro Universo 3D Celular - TE AMO 💖</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000000;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
        }

        #universeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        .music-player-bar {
            position: fixed;
            top: 15px;
            z-index: 50;
            background: rgba(15, 5, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 0, 128, 0.7);
            border-radius: 50px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.6), inset 0 0 10px rgba(0, 243, 255, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease;
            pointer-events: auto;
        }

        .music-player-bar:active {
            transform: scale(0.92);
        }

        .music-icon {
            font-size: 1rem;
        }

        .music-text {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #ff758c;
            text-shadow: 0 0 10px rgba(255, 117, 140, 0.8);
        }

        .free-photo-container {
            position: relative;
            z-index: 10;
            width: 210px;
            height: 275px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 0, 128, 0.85), 0 0 120px rgba(0, 243, 255, 0.65);
            transform-style: preserve-3d;
            animation: floatPhoto 6s ease-in-out infinite alternate;
            border: 2px solid rgba(255, 255, 255, 0.5);
            pointer-events: auto;
            cursor: pointer;
        }

        @keyframes floatPhoto {
            0% { transform: translateY(-10px) rotate(-1deg) scale(1) perspective(1000px) rotateX(3deg); }
            100% { transform: translateY(12px) rotate(1deg) scale(1.02) perspective(1000px) rotateX(-3deg); }
        }

        .free-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #unlockOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(0,0,0,0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.8s ease;
            padding: 0 20px;
            text-align: center;
        }

        #unlockOverlay h2 {
            color: #ff758c;
            font-size: 1.3rem;
            margin-bottom: 12px;
            text-shadow: 0 0 20px #ff007f;
        }

        #unlockOverlay p {
            color: #00f3ff;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="unlockOverlay" onclick="startUniverse()">
        <h2>Toca en cualquier lugar para entrar a nuestra galaxia 3D 💖</h2>
        <p>[ INICIAR UNIVERSO CÓSMICO ]</p>
    </div>

    <div class="music-player-bar" onclick="toggleMusic()">
        <div class="music-icon" id="musicIcon">🎵</div>
        <div class="music-text" id="musicText">MÚSICA</div>
    </div>

    <audio id="bgMusic" loop>
        <source src="Tiroteo.mp3" type="audio/mpeg">
    </audio>

    <canvas id="universeCanvas" onclick="handleCanvasClick(event)"></canvas>

    <div class="free-photo-container" onclick="triggerMagicBurst()">
        <img id="mainPhoto" src="7777.jpeg" alt="Mi Amor" onerror="this.src='77.jpg'">
    </div>

    <script>
        const canvas = document.getElementById('universeCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Estrellas adaptadas para móvil
        const stars = [];
        for (let i = 0; i < 550; i++) {
            stars.push({
                x: (Math.random() - 0.5) * width * 3.5,
                y: (Math.random() - 0.5) * height * 3.5,
                z: Math.random() * width,
                size: Math.random() * 2.8,
                color: ['#ff007f', '#00f3ff', '#7928ca', '#ffffff', '#ffaa00'][Math.floor(Math.random() * 5)]
            });
        }

        const explosionParticles = [];
        const shockwaves = [];

        // Galaxia gigante de fondo 3D optimizada para pantalla vertical de celular
        let galaxyAngle = 0;
        const galaxyParticles = [];
        for (let i = 0; i < 900; i++) {
            let angle = Math.random() * Math.PI * 4;
            let radius = Math.random() * (Math.max(width, height) * 0.9);
            galaxyParticles.push({
                angle: angle,
                radius: radius,
                baseRadius: radius,
                speed: 0.003 + Math.random() * 0.007,
                size: Math.random() * 3.5,
                hueOffset: Math.random() * 120
            });
        }

        let textPulse = 0;
        let heartPulse = 0;

        // Dragón de colores láser adaptado
        const dragonSegments = [];
        const totalSegments = 50;
        for (let i = 0; i < totalSegments; i++) {
            dragonSegments.push({ x: width / 2, y: height / 2 });
        }
        let dragonAngleTime = 0;

        // Tulipanes interactivos 3D adaptados al tamaño de pantalla de celular
        const interactiveTulips = [
            { id: 1, x: width * 0.2, y: height * 0.25, vx: 0.9, vy: 0.7, hue: 0, scale: 1.5, text: "Mi amor eterno 🌷" },
            { id: 2, x: width * 0.8, y: height * 0.75, vx: -0.8, vy: -0.9, hue: 120, scale: 1.4, text: "Eres mi todo ✨" },
            { id: 3, x: width * 0.22, y: height * 0.8, vx: 0.8, vy: -0.7, hue: 240, scale: 1.4, text: "Te amo con el alma 💖" },
            { id: 4, x: width * 0.78, y: height * 0.2, vx: -0.9, vy: 0.8, hue: 300, scale: 1.3, text: "Mi universo 🌌" }
        ];

        const burstQuotes = [
            "¡Te amo más que a nada en este mundo! 💖",
            "Eres el brillo de mis ojos y de toda mi galaxia ✨",
            "Mi corazón te pertenece por siempre y para siempre 🌹",
            "Contigo cada momento es un sueño mágico e infinito ♾️",
            "Eres la obra de arte más hermosa de mi universo 🌸",
            "¡TE AMO CON TODAS MIS FUERZAS! 💓"
        ];

        let touchX = width / 2;
        let touchY = height / 2;
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }
        });
        window.addEventListener('mousemove', (e) => {
            touchX = e.clientX;
            touchY = e.clientY;
        });

        function draw3DText(text, x, y, size = 18, customHue = null) {
            ctx.save();
            ctx.font = `900 ${size}px 'Segoe UI', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            let baseHue = customHue !== null ? customHue : (Date.now() * 0.05) % 360;

            for (let i = 5; i > 0; i--) {
                ctx.fillStyle = `hsla(${(baseHue + i * 15) % 360}, 100%, 30%, ${0.2 * i})`;
                ctx.fillText(text, x + i * 1.2, y + i * 1.2);
            }

            ctx.shadowBlur = 20;
            ctx.shadowColor = `hsl(${baseHue}, 100%, 50%)`;
            ctx.fillStyle = `hsl(${baseHue}, 100%, 80%)`;
            ctx.fillText(text, x, y);

            ctx.shadowBlur = 8;
            ctx.shadowColor = "#ffffff";
            ctx.fillStyle = "#ffffff";
            ctx.fillText(text, x - 1, y - 1);

            ctx.restore();
        }

        function draw3DTulip(x, y, scale, hueVal, rot3D = 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale * Math.cos(rot3D * 0.5), scale);

            ctx.shadowBlur = 25;
            ctx.shadowColor = `hsl(${hueVal}, 100%, 50%)`;

            ctx.strokeStyle = '#00ffaa';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(10, 25, 0, 48);
            ctx.stroke();

            ctx.fillStyle = '#00cc66';
            ctx.beginPath();
            ctx.ellipse(12, 25, 10, 4.5, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = `hsl(${hueVal}, 100%, 60%)`;
            ctx.beginPath();
            ctx.moveTo(0, -24);
            ctx.bezierCurveTo(-18, -24, -22, 0, 0, 10);
            ctx.bezierCurveTo(22, 0, 18, -24, 0, -24);
            ctx.fill();

            ctx.fillStyle = `hsl(${(hueVal + 45) % 360}, 100%, 75%)`;
            ctx.beginPath();
            ctx.moveTo(0, -19);
            ctx.bezierCurveTo(-12, -19, -14, 0, 0, 8);
            ctx.bezierCurveTo(14, 0, 12, -19, 0, -19);
            ctx.fill();

            ctx.restore();
        }

        function animateUniverse() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            let cx = width / 2;
            let cy = height / 2;

            // --- 1. GALAXIA GIGANTE DE FONDO 3D ---
            galaxyAngle += 0.006;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(galaxyAngle * 0.1);

            galaxyParticles.forEach((p, idx) => {
                p.angle += p.speed;
                let currentRadius = p.baseRadius + Math.sin(galaxyAngle * 3 + idx) * 20;
                
                let px = Math.cos(p.angle) * currentRadius * 1.6;
                let py = Math.sin(p.angle) * currentRadius * 1.3;

                let hue = (galaxyAngle * 30 + p.hueOffset) % 360;
                ctx.fillStyle = `hsl(${hue}, 100%, 65%)`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;

                ctx.beginPath();
                ctx.arc(px, py, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // --- 2. ESTRELLAS 3D ---
            stars.forEach(star => {
                star.z -= 1.3;
                if (star.z <= 0) star.z = width;

                let k = 280 / star.z;
                let px = (star.x + (touchX - cx) * 0.08) * k + cx;
                let py = (star.y + (touchY - cy) * 0.08) * k + cy;

                if (px >= 0 && px <= width && py >= 0 && py <= height) {
                    let pSize = Math.max(0.4, star.size * k);
                    ctx.fillStyle = star.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = star.color;
                    ctx.fillRect(px, py, pSize, pSize);
                }
            });

            // --- 3. ONDAS DE CHOQUE ---
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                let sw = shockwaves[i];
                sw.radius += 5;
                sw.alpha -= 0.025;

                if (sw.alpha <= 0) {
                    shockwaves.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.strokeStyle = sw.color;
                    ctx.lineWidth = 3.5;
                    ctx.globalAlpha = sw.alpha;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = sw.color;
                    ctx.beginPath();
                    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            // --- 4. TEXTO "¡TE AMO!" 3D ---
            textPulse += 0.04;
            let textScaleFactor = 1 + Math.sin(textPulse) * 0.06;
            ctx.save();
            ctx.translate(cx, cy - 170);
            ctx.scale(textScaleFactor, textScaleFactor);
            draw3DText("¡TE AMO!", 0, 0, 38);
            ctx.restore();

            // --- 5. CORAZÓN GIGANTE 3D ---
            heartPulse += 0.03;
            let currentHeartScale = (width < 400 ? 14.0 : 16.5) + Math.sin(heartPulse) * 2.0;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(currentHeartScale, currentHeartScale);
            ctx.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.04) {
                let hx = 16 * Math.pow(Math.sin(t), 3);
                let hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                if (t === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 0, 127, 0.08)';
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff007f';
            ctx.fill();
            ctx.lineWidth = 1.3;
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.45)';
            ctx.stroke();
            ctx.restore();

            // --- 6. DRAGÓN LÁSER ---
            dragonAngleTime += 0.035;
            let targetX = cx + Math.cos(dragonAngleTime * 1.4) * (width * 0.38);
            let targetY = cy + Math.sin(dragonAngleTime) * (height * 0.3);

            let head = dragonSegments[0];
            head.x += (targetX - head.x) * 0.1;
            head.y += (targetY - head.y) * 0.1;

            for (let i = 1; i < dragonSegments.length; i++) {
                let prev = dragonSegments[i - 1];
                let curr = dragonSegments[i];
                let dx = prev.x - curr.x;
                let dy = prev.y - curr.y;
                let angle = Math.atan2(dy, dx);
                curr.x = prev.x - Math.cos(angle) * 15;
                curr.y = prev.y - Math.sin(angle) * 15;
            }

            ctx.save();
            for (let i = dragonSegments.length - 1; i >= 0; i--) {
                let seg = dragonSegments[i];
                let ratio = i / totalSegments;
                let radius = (1 - ratio) * 16 + 3.5;
                let hue = (i * 10 + dragonAngleTime * 50) % 360;
                
                ctx.fillStyle = `hsl(${hue}, 100%, 65%)`;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;

                ctx.beginPath();
                ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // --- 7. TULIPANES 3D MÓVILES ---
            interactiveTulips.forEach(t => {
                t.x += t.vx;
                t.y += t.vy;
                t.hue = (t.hue + 0.8) % 360;
                if (t.x < 50 || t.x > width - 50) t.vx *= -1;
                if (t.y < 50 || t.y > height - 50) t.vy *= -1;

                draw3DTulip(t.x, t.y, t.scale, t.hue, galaxyAngle);
                draw3DText(t.text, t.x, t.y + 42, 12, t.hue);
            });

            // --- 8. EXPLOSIONES ---
            for (let i = explosionParticles.length - 1; i >= 0; i--) {
                let p = explosionParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.025;

                if (p.alpha <= 0) {
                    explosionParticles.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            requestAnimationFrame(animateUniverse);
        }

        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const clickY = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

            shockwaves.push({
                x: clickX,
                y: clickY,
                radius: 10,
                alpha: 1,
                color: Math.random() > 0.5 ? '#ff007f' : '#00f3ff'
            });

            interactiveTulips.forEach((t) => {
                let dist = Math.hypot(clickX - t.x, clickY - t.y);
                if (dist < 70) {
                    for (let k = 0; k < 75; k++) {
                        let angle = Math.random() * Math.PI * 2;
                        let speed = Math.random() * 8 + 2;
                        explosionParticles.push({
                            x: t.x,
                            y: t.y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            size: Math.random() * 4 + 1,
                            color: ['#ff007f', '#00f3ff', '#ffaa00', '#ffffff'][Math.floor(Math.random() * 4)],
                            alpha: 1
                        });
                    }

                    t.x = Math.random() * (width - 120) + 60;
                    t.y = Math.random() * (height - 120) + 60;
                    t.text = burstQuotes[Math.floor(Math.random() * burstQuotes.length)];
                }
            });
        }

        function triggerMagicBurst() {
            shockwaves.push({
                x: width / 2,
                y: height / 2,
                radius: 10,
                alpha: 1,
                color: '#ff007f'
            });

            for (let i = 0; i < 60; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * 350,
                    y: (Math.random() - 0.5) * 350,
                    z: Math.random() * 120 + 10,
                    size: Math.random() * 4 + 1,
                    color: Math.random() > 0.5 ? '#ff007f' : '#00f3ff'
                });
            }
        }

        let isPlaying = false;
        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const text = document.getElementById('musicText');

            if (isPlaying) {
                music.pause();
                text.innerText = "MÚSICA";
                isPlaying = false;
            } else {
                music.play().then(() => {
                    text.innerText = "🎶 ACTIVA";
                    isPlaying = true;
                }).catch(e => {
                    alert("Toca la pantalla para activar el audio.");
                });
            }
        }

        function startUniverse() {
            const overlay = document.getElementById('unlockOverlay');
            overlay.style.opacity = 0;
            setTimeout(() => { overlay.style.display = 'none'; }, 800);

            const music = document.getElementById('bgMusic');
            music.play().then(() => {
                document.getElementById('musicText').innerText = "🎶 ACTIVA";
                isPlaying = true;
            }).catch(e => {
                console.log("Audio bloqueado.");
            });

            animateUniverse();
        }

        window.addEventListener('load', () => {
            const music = document.getElementById('bgMusic');
            music.play().then(() => {
                const overlay = document.getElementById('unlockOverlay');
                if(overlay) {
                    overlay.style.opacity = 0;
                    setTimeout(() => { overlay.style.display = 'none'; }, 800);
                }
                document.getElementById('musicText').innerText = "🎶 ACTIVA";
                isPlaying = true;
                animateUniverse();
            }).catch(e => {
                animateUniverse();
            });
        });
    </script>
</body>
</html>
